# The documented configuration surface is environment variables; each is mapped here
# explicitly so the exact names deployers see are the ones that bind, with no reliance on
# relaxed-binding name folding.
coordinator.secrets=${COORDINATOR_SECRETS:}
coordinator.tenant-key=${COORDINATOR_TENANT_KEY:}
coordinator.tenant-slug=${COORDINATOR_TENANT_SLUG:}
coordinator.data-dir=${COORDINATOR_DATA_DIR:/data}
coordinator.public-read=${COORDINATOR_PUBLIC_READ:false}
coordinator.lease-ttl=${COORDINATOR_LEASE_TTL:20m}
coordinator.max-claim-batch=${COORDINATOR_MAX_CLAIM_BATCH:8}
# Attempts per unit before it is terminally FAILED. A failure with budget left goes
# straight back to the claimable queue, so retries need no extra failsafe pass.
coordinator.max-attempts=${COORDINATOR_MAX_ATTEMPTS:3}
coordinator.duration-clamp=${COORDINATOR_DURATION_CLAMP:60m}
coordinator.gc-idle=${COORDINATOR_GC_IDLE:7d}
coordinator.history-retention=${COORDINATOR_HISTORY_RETENTION:30d}

spring.main.banner-mode=off
server.port=${COORDINATOR_HTTP_PORT:8080}
server.address=${COORDINATOR_BIND:0.0.0.0}
logging.level.root=${COORDINATOR_LOG_LEVEL:info}
