version: 2

updates:
  # One entry covers the whole reactor: Dependabot follows <modules> from the root pom,
  # and every version in this build is declared as a property there.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # No ignore list: every bump, at any level, gets proposed. compatibility.json and
    # the README's matrix are the floor now -- a bump that breaks CI never merges, and
    # a bump that merges updates the tested version automatically (see README.md's
    # "Build-tool compatibility matrix").

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
