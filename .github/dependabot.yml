version: 2

updates:
  # One entry covers the whole reactor: Dependabot follows <modules> from the root pom,
  # and every version in this build is declared as a property there.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      # shard4j-engine lands on every consumer's test classpath, so anything that moves
      # its floor is an adoption decision, not a dependency update. Both entries below
      # exist to keep a bot from making that decision -- but they draw the line at
      # different levels, deliberately.
      #
      # JUnit Platform: patch-only. The Platform has changed the API this engine builds on
      # binary-incompatibly on every recent minor, so a *minor* bump moves the floor for
      # every consumer -- which is how 0.2.0 shipped requiring 1.14 without anyone choosing
      # to (#31). Patches within a minor keep the API shape, so those still flow -- CI is
      # what catches a patch that breaks behaviour (confirmed: 6.1.0/6.1.2 both fail
      # against 6.1.3, see README.md's "JUnit Platform version alignment").
      - dependency-name: org.junit:junit-bom
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Feign: major-only. It sets the release-17 baseline but does not break across
      # minors. See "Java baselines, and why they differ" in AGENTS.md.
      - dependency-name: io.github.openfeign:feign-bom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
