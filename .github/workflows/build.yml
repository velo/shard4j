name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
          cache: maven

      # Also runs the enforced module boundary: the engine may resolve no coordinator
      # artifact and no Spring artifact, and shard4j-protocol's runtime tree must be empty.
      - name: Build reactor
        run: mvn -B -ntp verify

  # The invocation every real consumer uses -- failsafe's coordinated profile in its own
  # forked JVM -- against a live coordinator container. The in-JVM harness runs three
  # shards inside one launcher process, so the fork boundary and the summary/report
  # plumbing are invisible to it; this job is where they break loudly.
  coordinated-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
          cache: maven

      - name: Build and install the reactor
        run: mvn -B -ntp -DskipTests install

      # The secret matches the one shard4j-example's failsafe configuration exports to
      # its forked JVMs; both are local values meaningless outside a build.
      - name: Start the coordinator container
        run: |
          JAR=$(ls shard4j-coordinator/target/shard4j-coordinator-*-app.jar)
          mkdir -p /tmp/shard4j-data
          docker run -d --name shard4j-coordinator -p 8080:8080 \
            -e COORDINATOR_SECRETS=local-integration-only \
            -e COORDINATOR_TENANT_KEY=example/orders-service \
            -e COORDINATOR_TENANT_SLUG=orders-service \
            -e COORDINATOR_DATA_DIR=/data \
            -v /tmp/shard4j-data:/data \
            -v "$PWD/$JAR":/opt/shard4j/app.jar \
            eclipse-temurin:25-jre java -jar /opt/shard4j/app.jar
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "coordinator never became ready" >&2
          docker logs shard4j-coordinator >&2 || true
          exit 1

      - name: Run the coordinated failsafe profile
        run: |
          mvn -B -ntp -f shard4j-example/pom.xml -Pcoordinated verify \
            -Dshard.coordinator.url=http://localhost:8080 \
            -Dshard.session.id=$(cat /proc/sys/kernel/random/uuid) \
            -Dshard.index=0

      # A green profile that executed nothing is the silent-green shape this repository
      # exists to delete: the summary must show real completed tests.
      - name: Assert the coordinated profile ran tests
        run: |
          summary=shard4j-example/target/failsafe-reports/failsafe-summary.xml
          test -f "$summary" || { echo "missing $summary" >&2; exit 1; }
          completed=$(sed -n 's/.*<completed>\([0-9][0-9]*\)<\/completed>.*/\1/p' "$summary")
          echo "coordinated run completed: ${completed:-0}"
          test "${completed:-0}" -ge 1

      - name: Stop the coordinator
        if: always()
        run: docker rm -f shard4j-coordinator

  # Builds the coordinator image on every run, so a PR proves it still builds; pushes to
  # GHCR only from main and release tags. GITHUB_TOKEN with packages: write is all the
  # registry needs -- no PAT. The smoke test boots the actual image: /healthz must answer
  # with a secret set, and an unset COORDINATOR_SECRETS must be a refused start.
  container-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
          cache: maven

      - name: Build the coordinator app jar
        run: mvn -B -ntp -DskipTests package

      - name: Build the image
        run: docker build -t shard4j-coordinator-ci shard4j-coordinator

      - name: Smoke test the image
        run: |
          mkdir -p /tmp/shard4j-smoke-data
          chmod 0777 /tmp/shard4j-smoke-data
          docker run -d --name shard4j-smoke -p 18080:8080 \
            -e COORDINATOR_SECRETS=local-smoke-only \
            -e COORDINATOR_TENANT_KEY=example/orders-service \
            -e COORDINATOR_TENANT_SLUG=orders-service \
            -v /tmp/shard4j-smoke-data:/data \
            shard4j-coordinator-ci
          ok=0
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:18080/healthz >/dev/null 2>&1 && { ok=1; break; }
            sleep 1
          done
          docker logs shard4j-smoke >&2 || true
          docker rm -f shard4j-smoke >/dev/null
          [ "$ok" = 1 ] || { echo "image never answered /healthz" >&2; exit 1; }
          docker run -d --name shard4j-smoke-nosecret shard4j-coordinator-ci
          refused=0
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' shard4j-smoke-nosecret)" = "false" ]; then
              refused=1
              break
            fi
            sleep 1
          done
          exitcode=$(docker inspect -f '{{.State.ExitCode}}' shard4j-smoke-nosecret)
          docker logs shard4j-smoke-nosecret 2>&1 | grep -q 'COORDINATOR_SECRETS' || refused=0
          docker rm -f shard4j-smoke-nosecret >/dev/null
          if [ "$refused" != 1 ] || [ "$exitcode" = 0 ]; then
            echo "image did not refuse to start without COORDINATOR_SECRETS" >&2
            exit 1
          fi

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          IMAGE=ghcr.io/${{ github.repository }}
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          docker tag shard4j-coordinator-ci "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          if [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            docker tag shard4j-coordinator-ci "$IMAGE:sha-${GITHUB_SHA::12}"
            docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          fi
          if [ '${{ github.ref_type }}' = 'tag' ]; then
            docker tag shard4j-coordinator-ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
