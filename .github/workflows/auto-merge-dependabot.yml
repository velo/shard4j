name: Dependabot auto-merge

# Blanket auto-merge is only defensible because `build.yml` is the gate: it runs the
# enforced module boundary, forbiddenapis over the engine's bytecode, the coordinated
# failsafe profile against a live coordinator, and the container smoke test. A dependency
# that breaks any of those never reaches this queue.
#
# Three repository settings make this work, and none of them lives in the tree. All three
# are set; the workflow is inert or red without them:
#
#   - "Allow auto-merge" on the repository. Without it the merge step fails outright.
#   - main requires the build.yml checks. Without them `--auto` degrades to merging on the
#     spot rather than waiting for green, which removes the entire safety argument above.
#   - "Allow GitHub Actions to create and approve pull requests". Without it the approve
#     step fails with "GitHub Actions is not permitted to approve pull requests".
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'velo/shard4j'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # github-actions[bot] approving dependabot[bot] is two distinct identities, which is
      # what makes this permissible at all. The action is idempotent -- a rebase re-fires
      # the workflow, and it will not stack a second review on an already-approved PR.
      - name: Auto-approve
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Squash, to match the single-line history this repository keeps.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
